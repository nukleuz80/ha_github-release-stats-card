name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Card version matches the README badge
        run: |
          v=$(grep -oP 'const CARD_VERSION = "\K[^"]+' github-release-stats-card.js)
          echo "Card version: $v"
          grep -q "version-$v-" README.md || { echo "::error::README.md badge does not show $v"; exit 1; }
          grep -q "version-$v-" README_de.md || { echo "::error::README_de.md badge does not show $v"; exit 1; }
